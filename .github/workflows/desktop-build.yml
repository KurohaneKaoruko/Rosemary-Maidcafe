name: Desktop Release (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.0.1)
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build:desktop

      - name: Verify bundle output
        shell: bash
        run: |
          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "Bundle directory not found"
            exit 1
          fi
          find src-tauri/target/release/bundle -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-maidcafe-${{ matrix.platform.name }}-${{ github.event.inputs.tag || github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List release files
        run: find release-artifacts -type f

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Rosemary MaidCafe ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*
